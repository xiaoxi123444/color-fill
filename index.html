<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="涂色台">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ff5d8f'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%23fff'/%3E%3C/svg%3E">
<title>涂色台 · 线稿快速填色</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#15151a;color:#eee;touch-action:none;user-select:none;-webkit-user-select:none}
#lockScreen{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#15151a;padding:24px}
#lockScreen h1{font-size:34px;margin-bottom:6px;background:linear-gradient(90deg,#ff5d8f,#ff9a62);-webkit-background-clip:text;background-clip:text;color:transparent}
#lockScreen .sub{color:#888;font-size:13px;margin-bottom:36px}
#lockScreen input{width:min(300px,80vw);padding:14px 18px;font-size:20px;letter-spacing:6px;text-align:center;border-radius:14px;border:1px solid #444;background:#22222a;color:#fff;outline:none}
#lockScreen input:focus{border-color:#ff5d8f}
#lockScreen button{margin-top:16px;width:min(300px,80vw);padding:14px;font-size:17px;border-radius:14px;border:none;background:linear-gradient(90deg,#ff5d8f,#ff7a5d);color:#fff;font-weight:600}
#lockErr{color:#ff6b6b;font-size:13px;margin-top:14px;min-height:18px}
#app{display:none;flex-direction:column;height:100%;height:100dvh}
#topbar{display:flex;align-items:center;gap:4px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#1e1e26;border-bottom:1px solid #2c2c36;flex-wrap:wrap}
#topbar .brand{font-weight:700;margin-right:auto;background:linear-gradient(90deg,#ff5d8f,#ff9a62);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:16px}
#topbar button{background:#2a2a34;color:#ddd;border:none;border-radius:10px;padding:7px 10px;font-size:12px}
#topbar button:active{background:#3a3a46}
#topbar button.hl{background:#ff5d8f;color:#fff;font-weight:600}
#layerBar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#1a1a20;border-bottom:1px solid #2c2c36;overflow-x:auto;overflow-y:hidden}
.lyr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 6px 4px;border-radius:10px;border:1px solid #33333d;background:#23232c;min-width:56px;cursor:pointer;flex-shrink:0}
.lyr.on{border-color:#ff5d8f;box-shadow:0 0 0 1px #ff5d8f}
.lyr canvas{width:40px;height:40px;border-radius:6px;background:#333;display:block}
.lyr .nm{font-size:10px;color:#bbb;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr .eye{font-size:10px;color:#888}
.lyr.hidden{opacity:.45}
#lyrAdd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;height:70px;border-radius:10px;border:1px dashed #444;color:#888;font-size:20px;cursor:pointer;flex-shrink:0}
#viewWrap{position:relative;flex:1;overflow:hidden;background:repeating-conic-gradient(#2a2a32 0% 25%, #24242c 0% 50%) 0 0/24px 24px}
#view{position:absolute;inset:0}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#777;font-size:15px;pointer-events:none;text-align:center;padding:20px}
#busy{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:5}
#panel{background:#1e1e26;border-top:1px solid #2c2c36;padding:12px;overflow-y:auto;max-height:44vh;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.row:last-child{margin-bottom:0}
#svBox{border-radius:12px;border:1px solid #3a3a46;touch-action:none}
.hueCol{display:flex;flex-direction:column;gap:8px;align-items:center}
#hueBar{border-radius:8px;border:1px solid #3a3a46;touch-action:none}
.curInfo{display:flex;flex-direction:column;gap:8px;font-size:12px;color:#999;flex:1;min-width:0}
.swatch{width:44px;height:44px;border-radius:12px;border:1px solid #555;flex-shrink:0}
#hexText{font-size:14px;color:#eee;font-family:monospace;white-space:nowrap}
.label{margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{width:34px;height:34px;border-radius:10px;border:1px solid #444;cursor:pointer;flex-shrink:0}
.chip:active{transform:scale(.9)}
.chip.sel{outline:2px solid #fff;outline-offset:1px}
.chip.add{background:#2a2a34;color:#ccc;display:flex;align-items:center;justify-content:center;font-size:20px}
.sliders label{flex:1;display:flex;flex-direction:column;font-size:12px;color:#999;gap:4px}
.sliders input{width:100%}
.sliders .val{color:#ff9a62;font-weight:600}
.sectionTitle{font-size:12px;color:#777;margin-bottom:6px}
</style>
</head>
<body>
<div id="lockScreen">
<h1>涂色台</h1>
<div class="sub">输入密码进门</div>
<input id="pwInput" type="password" inputmode="numeric" placeholder="密码">
<button id="unlockBtn">开 门</button>
<div id="lockErr"></div>
</div>
<div id="app">
<div id="topbar">
<span class="brand">涂色台</span>
<button id="fileBtn">导入PNG/PSD</button>
<button id="newLayerBtn">＋图层</button>
<button id="upBtn">上移</button>
<button id="downBtn">下移</button>
<button id="delBtn">删层</button>
<button id="undoBtn">撤销</button>
<button id="clearBtn">清空本层</button>
<button id="pngBtn">PNG</button>
<button id="psdBtn" class="hl">PSD</button>
<button id="lockBtn">锁</button>
</div>
<div id="layerBar"></div>
<div id="viewWrap">
<canvas id="view"></canvas>
<div id="hint">点上面「导入PNG/PSD」放文件进来<br>PSD会带着全部图层进来，选一层填色<br>单指画圈填色 · 双指缩放移动</div>
<div id="busy">处理中…</div>
</div>
<div id="panel">
<div class="row">
<canvas id="svBox" width="150" height="150"></canvas>
<div class="hueCol">
<canvas id="hueBar" width="26" height="150"></canvas>
<div class="swatch" id="curSwatch"></div>
</div>
<div class="curInfo">
<div class="label">当前色</div>
<div id="hexText">#000000</div>
<div class="label" style="margin-top:6px">上一个色</div>
<div class="swatch" id="prevSwatch" style="width:30px;height:30px"></div>
</div>
</div>
<div>
<div class="sectionTitle">历史颜色</div>
<div class="chips" id="histRow"></div>
</div>
<div style="margin-top:10px">
<div class="sectionTitle">常用色卡 · 点取色 · 点+存当前色 · 长按删除</div>
<div class="chips" id="palRow"></div>
</div>
<div class="row sliders" style="margin-top:10px">
<label>闭合容差 <span class="val" id="tolVal">2px</span><input type="range" id="tol" min="0" max="20" step="1" value="2"></label>
<label>垫边量 <span class="val" id="padVal">2px</span><input type="range" id="pad" min="0" max="10" step="1" value="2"></label>
</div>
</div>
</div>
<input type="file" id="file" hidden>
<script>
"use strict";
const PASS_HASH="460fd82fe0827c5050cb22ea0105c652ead9d77c921e52968d4086a1693cf050";
const $=id=>document.getElementById(id);
const DPR=Math.min(window.devicePixelRatio||1,2);
const PRESET=["#ffe0d1","#f6c4a8","#e8a683","#d98a63","#c96f4a","#a8543a",
"#fdd7e4","#f7b8c9","#ff8fab","#ff5d8f","#e63964","#b83255",
"#3d3d4a","#5a5a6e","#8a8aa0","#c9c9d8","#6b4f3a","#8a6a4f"];
let cur={h:0,s:0,v:0};
let prev=null;
let hist=[];
let userPal=[];
try{userPal=JSON.parse(localStorage.getItem("bxtc_pal")||"[]");}catch(e){}
let layers=[];
let activeIdx=-1;
let scale=1,ox=0,oy=0;
let pts=[],drawing=false;
const view=$("view"),wrap=$("viewWrap");
const vctx=view.getContext("2d");
let pinch=null;
let undos=[];
let layNum=0;

/* ---------- 密码锁 ---------- */
async function sha256(t){
 const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function unlockUI(){ $("lockScreen").style.display="none"; $("app").style.display="flex"; resize(); }
$("unlockBtn").onclick=async()=>{
 const v=$("pwInput").value.trim();
 const h=await sha256(v);
 if(h===PASS_HASH){localStorage.setItem("bxtc_ok","1");unlockUI();}
 else{$("lockErr").textContent="密码不对";$("pwInput").value="";}
};
$("pwInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("unlockBtn").click();});
if(localStorage.getItem("bxtc_ok")==="1")unlockUI();
$("lockBtn").onclick=()=>{localStorage.removeItem("bxtc_ok");location.reload();};

/* ---------- 颜色 ---------- */
function hsvToRgb(h,s,v){
 h=((h%360)+360)%360;
 const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
 let r,g,b;
 if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
 else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
 return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function rgbToHex(rgb){return "#"+rgb.map(x=>x.toString(16).padStart(2,"0")).join("");}
function curHex(){return rgbToHex(hsvToRgb(cur.h,cur.s,cur.v));}
function setCur(h,s,v,pushHist){
 cur={h,s,v};
 if(pushHist){hist.unshift(curHex());hist=hist.slice(0,12);}
 renderPicker();renderHist();
}
function renderPicker(){
 const sx=$("svBox"),sctx=sx.getContext("2d");
 const g1=sctx.createLinearGradient(0,0,sx.width,0);
 g1.addColorStop(0,"#fff");g1.addColorStop(1,"hsl("+cur.h+",100%,50%)");
 sctx.fillStyle=g1;sctx.fillRect(0,0,sx.width,sx.height);
 const g2=sctx.createLinearGradient(0,0,0,sx.height);
 g2.addColorStop(0,"rgba(0,0,0,0)");g2.addColorStop(1,"#000");
 sctx.fillStyle=g2;sctx.fillRect(0,0,sx.width,sx.height);
 const x=cur.s*sx.width,y=(1-cur.v)*sx.height;
 sctx.strokeStyle="#fff";sctx.lineWidth=3;sctx.beginPath();sctx.arc(x,y,7,0,7);sctx.stroke();
 sctx.strokeStyle="#000";sctx.lineWidth=1.5;sctx.beginPath();sctx.arc(x,y,8.5,0,7);sctx.stroke();
 const hb=$("hueBar"),hctx=hb.getContext("2d");
 for(let i=0;i<hb.height;i++){hctx.fillStyle="hsl("+(i/hb.height*360)+",100%,50%)";hctx.fillRect(0,i,hb.width,1);}
 const hy=cur.h/360*hb.height;
 hctx.strokeStyle="#fff";hctx.lineWidth=3;hctx.beginPath();hctx.moveTo(0,hy);hctx.lineTo(hb.width,hy);hctx.stroke();
 $("curSwatch").style.background=curHex();
 $("hexText").textContent=curHex().toUpperCase();
 $("prevSwatch").style.background=prev||"#333";
}
$("svBox").addEventListener("pointerdown",e=>{pickSV(e);$("svBox").setPointerCapture(e.pointerId);});
$("svBox").addEventListener("pointermove",e=>{if(e.buttons)pickSV(e);});
function pickSV(e){
 const r=$("svBox").getBoundingClientRect();
 setCur(cur.h,Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height)),false);
}
$("hueBar").addEventListener("pointerdown",e=>{pickHue(e);$("hueBar").setPointerCapture(e.pointerId);});
$("hueBar").addEventListener("pointermove",e=>{if(e.buttons)pickHue(e);});
function pickHue(e){
 const r=$("hueBar").getBoundingClientRect();
 setCur(Math.min(360,Math.max(0,(e.clientY-r.top)/r.height*360)),cur.s,cur.v,false);
}
["svBox","hueBar"].forEach(id=>$(id).addEventListener("pointerup",()=>setCur(cur.h,cur.s,cur.v,true)));
function renderHist(){
 const row=$("histRow");row.innerHTML="";
 hist.forEach((c,i)=>{
  const d=document.createElement("div");d.className="chip"+(i===0?" sel":"");
  d.style.background=c;
  d.onclick=()=>{rgbToHsv(hexToRgb(c),cur);setCur(cur.h,cur.s,cur.v,true);};
  row.appendChild(d);
 });
}
function hexToRgb(h){
 const n=parseInt(h.slice(1),16);
 return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgbToHsv(rgb,hsv){
 const r=rgb[0]/255,g=rgb[1]/255,b=rgb[2]/255;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
 hsv.v=mx;
 hsv.s=mx===0?0:d/mx;
 if(d===0)hsv.h=0;
 else if(mx===r)hsv.h=((g-b)/d)%6*60;
 else if(mx===g)hsv.h=((b-r)/d+2)*60;
 else hsv.h=((r-g)/d+4)*60;
 if(hsv.h<0)hsv.h+=360;
}
function renderPal(){
 const row=$("palRow");row.innerHTML="";
 [...PRESET,...userPal].forEach(c=>{
  const d=document.createElement("div");d.className="chip";
  d.style.background=c;
  d.onclick=()=>{rgbToHsv(hexToRgb(c),cur);setCur(cur.h,cur.s,cur.v,true);};
  d.oncontextmenu=e=>{e.preventDefault();};
  let t;
  d.addEventListener("pointerdown",()=>{t=setTimeout(()=>{removePal(c);},600);});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>d.addEventListener(ev,()=>clearTimeout(t)));
  row.appendChild(d);
 });
 const add=document.createElement("div");add.className="chip add";add.textContent="+";
 add.onclick=()=>{const c=curHex();if(!userPal.includes(c)){userPal.push(c);savePal();renderPal();}};
 row.appendChild(add);
}
function removePal(c){
 userPal=userPal.filter(x=>x!==c);savePal();renderPal();
}
function savePal(){localStorage.setItem("bxtc_pal",JSON.stringify(userPal));}

/* ---------- 画布 ---------- */
function resize(){
 const r=wrap.getBoundingClientRect();
 view.width=r.width*DPR;view.height=r.height*DPR;
 draw();
}
window.addEventListener("resize",resize);
function canvasSize(){
 return layers.length?layers[0].cv.width:0;
}
function draw(){
 const r=wrap.getBoundingClientRect();
 vctx.setTransform(DPR,0,0,DPR,0,0);
 vctx.clearRect(0,0,r.width,r.height);
 if(!layers.length)return;
 vctx.setTransform(DPR*scale,0,0,DPR*scale,DPR*ox,DPR*oy);
 for(let i=0;i<layers.length;i++){
  const l=layers[i];
  if(!l.visible)continue;
  vctx.globalAlpha=l.opacity/255;
  vctx.drawImage(l.cv,0,0);
 }
 vctx.globalAlpha=1;
 if(pts.length>1){
  vctx.strokeStyle=curHex();vctx.lineWidth=2/scale;vctx.lineCap="round";vctx.lineJoin="round";
  vctx.beginPath();
  pts.forEach((p,i)=>i?vctx.lineTo(p.x,p.y):vctx.moveTo(p.x,p.y));
  vctx.stroke();
 }
 vctx.setTransform(DPR,0,0,DPR,0,0);
}
function toWork(cx,cy){
 const r=wrap.getBoundingClientRect();
 return {x:(cx-r.left-ox)/scale,y:(cy-r.top-oy)/scale};
}

/* ---------- 图层 ---------- */
function renderLayers(){
 const bar=$("layerBar");bar.innerHTML="";
 for(let i=layers.length-1;i>=0;i--){
  const l=layers[i];
  const d=document.createElement("div");
  d.className="lyr"+(i===activeIdx?" on":"")+(l.visible?"":" hidden");
  const c=document.createElement("canvas");c.width=40;c.height=40;
  const cc=c.getContext("2d");
  cc.fillStyle="#40404a";cc.fillRect(0,0,40,40);
  cc.drawImage(l.cv,0,0,40,40);
  const nm=document.createElement("div");nm.className="nm";nm.textContent=l.name;
  const eye=document.createElement("div");eye.className="eye";eye.textContent=l.visible?"👁":"✕";
  d.appendChild(c);d.appendChild(nm);d.appendChild(eye);
  d.onclick=e=>{
   if(e.target===eye){l.visible=!l.visible;renderLayers();draw();return;}
   activeIdx=i;renderLayers();
  };
  bar.appendChild(d);
 }
 const add=document.createElement("div");add.id="lyrAdd";add.textContent="+";
 add.onclick=newLayer;
 bar.appendChild(add);
}
function newLayer(){
 const w=canvasSize();
 if(!w)return alert("先导入文件");
 const c=document.createElement("canvas");c.width=w;c.height=layers[0].cv.height;
 layers.push({name:"图层"+(++layNum),visible:true,opacity:255,cv:c});
 activeIdx=layers.length-1;
 undos=[];
 renderLayers();draw();
}
$("newLayerBtn").onclick=newLayer;
$("delBtn").onclick=()=>{
 if(!layers.length)return;
 if(layers.length===1)return alert("至少留一层");
 layers.splice(activeIdx,1);
 activeIdx=Math.min(activeIdx,layers.length-1);
 undos=[];
 renderLayers();draw();
};
$("upBtn").onclick=()=>{
 if(activeIdx<layers.length-1){
  const t=layers[activeIdx];layers[activeIdx]=layers[activeIdx+1];layers[activeIdx+1]=t;
  activeIdx++;
  renderLayers();draw();
 }
};
$("downBtn").onclick=()=>{
 if(activeIdx>0){
  const t=layers[activeIdx];layers[activeIdx]=layers[activeIdx-1];layers[activeIdx-1]=t;
  activeIdx--;
  renderLayers();draw();
 }
};

/* ---------- 导入 ---------- */
$("fileBtn").onclick=()=>$("file").click();
$("file").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 showBusy(true);
 try{
  if(f.name.toLowerCase().endsWith(".psd")){
   await loadPsd(await f.arrayBuffer());
  } else {
   await loadImage(f);
  }
  $("hint").style.display="none";
 }catch(err){
  alert("读不了："+err.message);
 }
 e.target.value="";
 showBusy(false);
};
function loadImage(f){
 return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{
   let w=img.width,h=img.height;
   const LIMIT=4096;
   if(Math.max(w,h)>LIMIT){const k=LIMIT/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
   const lc=document.createElement("canvas");lc.width=w;lc.height=h;
   const cc=document.createElement("canvas");cc.width=w;cc.height=h;
   lc.getContext("2d").drawImage(img,0,0,w,h);
   layers=[{name:"线稿",visible:true,opacity:255,cv:lc},
           {name:"颜色",visible:true,opacity:255,cv:cc}];
   activeIdx=0;layNum=1;undos=[];
   fitView();renderLayers();draw();res();
  };
  img.onerror=()=>rej(new Error("图片读不出来"));
  img.src=URL.createObjectURL(f);
 });
}
function fitView(){
 const r=wrap.getBoundingClientRect();
 const w=canvasSize();
 scale=Math.min((r.width-40)/w,(r.height-40)/w,2);
 scale=Math.max(scale,0.05);
 ox=(r.width-w*scale)/2;oy=(r.height-w*scale)/2;
}

/* ---------- PSD 读取 ---------- */
function unpackRow(u8,si,len,out,di,w){
 let i=si;
 while(i<si+len){
  const n=u8[i++];
  if(n>=128){
   const v=u8[i++];
   for(let k=0;k<257-n;k++)out[di++]=v;
  } else {
   const cnt=n+1;
   for(let k=0;k<cnt;k++)out[di++]=u8[i++];
  }
 }
}
function loadPsd(buf){
 return new Promise((res,rej)=>{
  const u8=new Uint8Array(buf);
  const dv=new DataView(buf);
  let o=0,stage="头";
  const chk=n=>{if(o+n>u8.length)throw new Error("读越界(偏移"+o+")");};
  try{
   stage="签名";
   if(u8.length<26)throw new Error("文件太小");
   if(String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=="8BPS")throw new Error("不是PSD文件");
   o=4+2+6+2;
   chk(4);const h=dv.getUint32(o);o+=4;
   chk(4);const w=dv.getUint32(o);o+=4;
   chk(2);const depth=dv.getUint16(o);o+=2;
   chk(2);const mode=dv.getUint16(o);o+=2;
   if(depth!==8)throw new Error("只支持8位PSD");
   if(mode!==3&&mode!==1)throw new Error("只支持RGB/灰度PSD，CMYK打不开");
   if(w>4096||h>4096)throw new Error("画布超过4096，太大了");
   chk(4);o+=4+dv.getUint32(o);
   chk(4);o+=4+dv.getUint32(o);
   chk(4);o+=4;
   chk(4);o+=4;
   stage="图层记录";
   chk(2);const cnt=dv.getInt16(o);o+=2;
   const n=Math.abs(cnt);
   const metas=[];
   for(let i=0;i<n;i++){
    chk(16);
    const top=dv.getInt32(o),left=dv.getInt32(o+4),bottom=dv.getInt32(o+8),right=dv.getInt32(o+12);o+=16;
    chk(2);const nch=dv.getUint16(o);o+=2;
    const chs=[];
    for(let c=0;c<nch;c++){chk(6);chs.push({id:dv.getInt16(o),len:dv.getUint32(o+2)});o+=6;}
    chk(8);o+=8;
    chk(1);const opacity=dv.getUint8(o);o++;
    chk(1);o++;
    chk(1);const flags=dv.getUint8(o);o++;
    chk(1);o++;
    chk(4);const extraLen=dv.getUint32(o);o+=4;
    const extraEnd=o+extraLen;
    if(extraEnd>u8.length)throw new Error("图层"+(i+1)+"额外数据越界");
    chk(4);o+=4+dv.getUint32(o);
    chk(4);o+=4+dv.getUint32(o);
    chk(1);const nameLen=dv.getUint8(o);o++;
    let name="";
    for(let k=0;k<nameLen;k++){chk(1);name+=String.fromCharCode(u8[o+k]);}
    const pad=(4-((1+nameLen)%4))%4;
    o+=nameLen+pad;
    if(o>extraEnd)o=extraEnd;
    if(!name)name="图层"+i;
    for(let s=o;s<extraEnd-8;s++){
     if(u8[s]===0x38&&u8[s+1]===0x42&&u8[s+2]===0x49&&u8[s+3]===0x4D&&
        u8[s+4]===0x6C&&u8[s+5]===0x75&&u8[s+6]===0x6E&&u8[s+7]===0x69){
      const ll=dv.getUint32(s+8);
      let un="";
      for(let k=0;k<ll;k+=2)un+=String.fromCharCode(dv.getUint16(s+12+k));
      if(un)name=un;
      break;
     }
    }
    metas.push({top,left,bottom,right,chs,opacity,visible:!(flags&2),name});
    o=extraEnd;
   }
   stage="通道数据";
   const outLayers=[];
   for(const m of metas){
    const lw=m.right-m.left,lh=m.bottom-m.top;
    const chans={};
    for(const ci of m.chs){
     chk(2);const comp=dv.getUint16(o);o+=2;
     const data=new Uint8Array(lw*lh);
     if(comp===0){
      for(let y=0;y<lh;y++){
       chk(2);o+=2;
       chk(lw);
       for(let x=0;x<lw;x++)data[y*lw+x]=u8[o+x];
       o+=lw;
      }
     } else if(comp===1){
      for(let y=0;y<lh;y++){
       chk(2);const rl=dv.getUint16(o);o+=2;
       chk(rl);
       unpackRow(u8,o,rl,data,y*lw,lw);
       o+=rl;
      }
     } else {
      if(ci.len<2)throw new Error("通道长度异常");
      chk(ci.len-2);
      o+=ci.len-2;
      continue;
     }
     chans[ci.id]=data;
    }
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    const ctx=cv.getContext("2d");
    const img=ctx.createImageData(w,h);
    const R=chans[0],G=chans[1],B=chans[2],A=chans[-1];
    const gray=mode===1;
    for(let y=0;y<lh;y++){
     for(let x=0;x<lw;x++){
      const s=y*lw+x;
      const di=((m.top+y)*w+(m.left+x))*4;
      if(gray){
       const gv=R?R[s]:0;
       img.data[di]=gv;img.data[di+1]=gv;img.data[di+2]=gv;
      } else {
       img.data[di]=R?R[s]:0;
       img.data[di+1]=G?G[s]:0;
       img.data[di+2]=B?B[s]:0;
      }
      img.data[di+3]=A?A[s]:255;
     }
    }
    ctx.putImageData(img,0,0);
    outLayers.push({name:m.name,visible:m.visible,opacity:m.opacity,cv});
   }
   if(!outLayers.length)throw new Error("PSD里没有图层");
   layers=outLayers.reverse();
   activeIdx=layers.length-1;
   layNum=layers.length;undos=[];
   fitView();renderLayers();draw();
   res();
  }catch(err){
   rej(new Error(stage+"："+err.message));
  }
 });
}

wrap.addEventListener("touchstart",e=>{
 if(!layers.length)return;
 if(e.touches.length===1&&!pinch){
  touchMode="draw";

 } else if(e.touches.length===2){
  touchMode="pinch";
  const a=e.touches[0],b=e.touches[1];
  pinch={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s0:scale,
   mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2,ox,oy,
   rx:wrap.getBoundingClientRect().left,ry:wrap.getBoundingClientRect().top};
  pts=[];
 }
 e.preventDefault();
},{passive:false});
wrap.addEventListener("touchmove",e=>{
 if(!layers.length)return;
 if(touchMode==="draw"&&e.touches.length===1){
  pts.push(toWork(e.touches[0].clientX,e.touches[0].clientY));
  if(pts.length>200)pts=pts.slice(-200);
  draw();
 } else if(touchMode==="pinch"&&e.touches.length===2){
  const a=e.touches[0],b=e.touches[1];
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  let ns=pinch.s0*d/pinch.d0;
  ns=Math.min(20,Math.max(0.05,ns));
  const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
  const wx=(pinch.mx-pinch.rx-pinch.ox)/pinch.s0;
  const wy=(pinch.my-pinch.ry-pinch.oy)/pinch.s0;
  ox=mx-pinch.rx-wx*ns;
  oy=my-pinch.ry-wy*ns;
  scale=ns;draw();
 }
 e.preventDefault();
},{passive:false});
wrap.addEventListener("touchend",e=>{
 if(touchMode==="draw"){
  if(pts.length>2)doFill(pts);
  pts=[];draw();
 }
 if(e.touches.length<2)pinch=null;

});

/* ---------- 填充算法 ---------- */
function boundsOf(pts){
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
 return {x0,y0,x1,y1};
}
function drawRingMask(mask,W,H,pts,x0,y0){
 const lw=2;
 const plot=(x,y)=>{if(x>=0&&x<W&&y>=0&&y<H)mask[y*W+x]=1;};
 for(let i=0;i<pts.length-1;i++){
  const a=pts[i],b=pts[i+1];
  const dx=b.x-a.x,dy=b.y-a.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/0.5));
  for(let t=0;t<=n;t++){
   const x=a.x+dx*t/n,y=a.y+dy*t/n;
   for(let oy2=-lw;oy2<=lw;oy2++)for(let ox2=-lw;ox2<=lw;ox2++)
    if(ox2*ox2+oy2*oy2<=lw*lw)plot(Math.round(x-x0)+ox2,Math.round(y-y0)+oy2);
  }
 }
}
function insideMap(mask,W,H){
 const ins=new Uint8Array(W*H);
 for(let y=0;y<H;y++){
  let flag=false;
  for(let x=0;x<W;x++){
   if(mask[y*W+x]){flag=!flag;while(x+1<W&&mask[y*W+x+1])x++;}
   else if(flag)ins[y*W+x]=1;
  }
 }
 return ins;
}
function obstacleMap(x0,y0,W,H){
 const w=layers[0].cv.width,h=layers[0].cv.height;
 const obs=document.createElement("canvas");obs.width=w;obs.height=h;
 const oc=obs.getContext("2d");
 for(let i=0;i<layers.length;i++){
  if(i===activeIdx||!layers[i].visible)continue;
  oc.drawImage(layers[i].cv,0,0);
 }
 const d=oc.getImageData(x0,y0,W,H).data;
 const wall=new Uint8Array(W*H);
 for(let i=0;i<W*H;i++){
  const o=i*4;
  if(d[o+3]>20&&(d[o]+d[o+1]+d[o+2])/3<180)wall[i]=1;
 }
 return wall;
}
function dilateRect(src,dst,W,H,R){
 dst.fill(0);
 for(let y=0;y<H;y++){
  let last=-1e9;
  const base=y*W;
  for(let x=0;x<W;x++)if(src[base+x])last=x;
  for(let x=0;x<W;x++)if(src[base+x]){last=x;dst[base+x]=1;}else if(x-last<=R)dst[base+x]=1;
 }
 src.set(dst);
 dst.fill(0);
 for(let x=0;x<W;x++){
  let last=-1e9;
  for(let y=0;y<H;y++)if(src[y*W+x]){last=y;dst[y*W+x]=1;}else if(y-last<=R)dst[y*W+x]=1;
 }
 src.set(dst);
}
function erodeRect(src,dst,W,H,R){
 dst.fill(0);
 for(let y=0;y<H;y++){
  let run0=0;const base=y*W;
  for(let x=0;x<W;x++){
   if(!src[base+x]){run0=R+1;}
   else{run0=run0>0?run0-1:0;}
   if(run0===0)dst[base+x]=1;
  }
  let run0r=0;
  for(let x=W-1;x>=0;x--){
   if(!src[base+x]){run0r=R+1;}
   else{run0r=run0r>0?run0r-1:0;}
   if(run0r>0)dst[base+x]=0;
  }
 }
 src.set(dst);
 dst.fill(0);
 for(let x=0;x<W;x++){
  let run0=0;
  for(let y=0;y<H;y++){
   if(!src[y*W+x]){run0=R+1;}
   else{run0=run0>0?run0-1:0;}
   if(run0===0)dst[y*W+x]=1;
  }
  let run0r=0;
  for(let y=H-1;y>=0;y--){
   if(!src[y*W+x]){run0r=R+1;}
   else{run0r=run0r>0?run0r-1:0;}
   if(run0r>0)dst[y*W+x]=0;
  }
 }
 src.set(dst);
}
function doFill(pts){
 if(!layers.length||activeIdx<0)return;
 const tol=+$("tol").value,pad=+$("pad").value;
 const Wfull=layers[0].cv.width,Hfull=layers[0].cv.height;
 const b=boundsOf(pts);
 const MARGIN=tol+pad+8;
 const x0=Math.max(0,Math.floor(b.x0)-MARGIN);
 const y0=Math.max(0,Math.floor(b.y0)-MARGIN);
 const x1=Math.min(Wfull,Math.ceil(b.x1)+MARGIN);
 const y1=Math.min(Hfull,Math.ceil(b.y1)+MARGIN);
 const W=x1-x0,H=y1-y0;
 if(W<=0||H<=0)return;
 showBusy(true);
 setTimeout(()=>{
  try{
   const ring=new Uint8Array(W*H);
   drawRingMask(ring,W,H,pts,x0,y0);
   const ins=insideMap(ring,W,H);
   const wall=obstacleMap(x0,y0,W,H);
   if(tol>0){
    const t=new Uint8Array(W*H);
    dilateRect(wall,t,W,H,tol);
    erodeRect(wall,t,W,H,tol);
   }
   const fillM=new Uint8Array(W*H);
   for(let i=0;i<W*H;i++)if(ins[i]&&!wall[i])fillM[i]=1;
   const lcv=layers[activeIdx].cv;
   const col=lcv.getContext("2d");
   const img=col.getImageData(x0,y0,W,H);
   const rgb=hsvToRgb(cur.h,cur.s,cur.v);
   undos.push({idx:activeIdx,x0,y0,W,H,data:new Uint8ClampedArray(img.data)});
   if(undos.length>3)undos.shift();
   const write=(i)=>{const o=i*4;img.data[o]=rgb[0];img.data[o+1]=rgb[1];img.data[o+2]=rgb[2];img.data[o+3]=255;};
   const q=[];let head=0;
   for(let i=0;i<W*H;i++)if(fillM[i]){write(i);q.push(i);}
   for(let step=0;step<pad&&head<q.length;step++){
    const n=q.length;
    for(;head<n;head++){
     const i=q[head],x=i%W,y=(i-x)/W;
     const nb=[];
     if(x>0)nb.push(i-1);if(x<W-1)nb.push(i+1);
     if(y>0)nb.push(i-W);if(y<H-1)nb.push(i+W);
     for(const j of nb){
      if(!ins[j]||fillM[j])continue;
      fillM[j]=1;write(j);q.push(j);
     }
    }
   }
   col.putImageData(img,x0,y0);
   draw();renderLayers();
  }catch(err){console.error(err);alert("处理出错："+err.message);}
  showBusy(false);
 },30);
}
function showBusy(v){$("busy").style.display=v?"block":"none";}

/* ---------- 撤销 / 清空 ---------- */
$("undoBtn").onclick=()=>{

function compositeVisible(){

/* ---------- PSD 编码 ---------- */
function makePsd(){
 const w=layers[0].cv.width,h=layers[0].cv.height;
 const packRow=function(row){
  const out=[];let i=0;const n=row.length;
  while(i<n){
   let j=i+1;
   while(j<n&&row[j]===row[i]&&j-i<128)j++;
   if(j-i>=2){
    out.push(257-(j-i));out.push(row[i]);i=j;
   } else {
    let k=i;
    while(k<n){
     let m=k+1;
     while(m<n&&row[m]===row[k]&&m-k<128)m++;
     if(m-k>=3)break;
     k=m;
     if(k-i>=128)break;
    }
    out.push(k-i-1);
    for(let t=i;t<k;t++)out.push(row[t]);
    i=k;
   }
  }
  return out;
 };
 const encLayer=function(l){
  const data=l.cv.getContext("2d").getImageData(0,0,w,h).data;
  const chs=[];
  for(let c=0;c<4;c++){
   const rows=[];
   for(let y=0;y<h;y++){
    const row=new Uint8Array(w);
    for(let x=0;x<w;x++)row[x]=data[(y*w+x)*4+c];
    rows.push(packRow(row));
   }
   chs.push(rows);
  }
  return chs;
 };
 const all=compositeVisible();
 const md=all.getContext("2d").getImageData(0,0,w,h).data;
 const mRows=[[],[],[]];
 for(let c=0;c<3;c++)
  for(let y=0;y<h;y++){
   const row=new Uint8Array(w);
   for(let x=0;x<w;x++)row[x]=md[(y*w+x)*4+c];
   mRows[c].push(packRow(row));
  }
 const bytes=[];
 const p8=v=>bytes.push(v&255);
 const p16=v=>{bytes.push((v>>8)&255,v&255);};
 const p32=v=>{bytes.push((v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255);};
 const pstr=s=>{for(let i=0;i<s.length;i++)p8(s.charCodeAt(i));};
 pstr("8BPS");p16(1);p16(0);p32(0);p16(3);p32(h);p32(w);p16(8);p16(3);
 p32(0);
 p32(0);
 const layerInfo=[];
 const p16li=v=>layerInfo.push((v>>8)&255,v&255);
 const p32li=v=>layerInfo.push((v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255);
 const p8li=v=>layerInfo.push(v&255);
 const psli=s=>{for(let i=0;i<s.length;i++)layerInfo.push(s.charCodeAt(i));};
 const encLayers=layers.slice().reverse();
 p16li(encLayers.length);
 const recs=encLayers.map((l,idx)=>{
  const r=[];
  const p16r=v=>r.push((v>>8)&255,v&255);
  const p32r=v=>r.push((v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255);
  const p8r=v=>r.push(v&255);
  const psr=s=>{for(let i=0;i<s.length;i++)r.push(s.charCodeAt(i));};
  const chs=encLayer(l);
  p32r(0);p32r(0);p32r(h);p32r(w);
  p16r(4);
  for(let c=0;c<4;c++){
   p16r(c<3?c:0xFFFF);
   let t=0;chs[c].forEach(rows=>rows.forEach(rw=>t+=2+rw.length));
   p32r(t);
  }
  psr("8BIM");psr("norm");
  p8r(l.opacity);p8r(0);p8r(0);p8r(0);
  const asciiName="layer"+idx;
  const pascalLen=1+asciiName.length;
  const pad1=(4-(pascalLen%4))%4;
  let extraLen=4+4+pascalLen+pad1;
  let luni="";
  if(/[^\x00-\x7f]/.test(l.name))luni=l.name;
  if(luni)extraLen+=4+4+luni.length*2;
  p32r(extraLen);
  p32r(0);p32r(0);
  p8r(asciiName.length);psr(asciiName);
  for(let i=0;i<pad1;i++)p8r(0);
  if(luni){
   psr("8BIM");psr("luni");
   p32r(luni.length*2);
   for(let i=0;i<luni.length;i++){const c=luni.charCodeAt(i);p8r((c>>8)&255);p8r(c&255);}
  }
  return {rec:r,chs};
 });
 recs.forEach(x=>layerInfo.push(...x.rec));
 recs.forEach(x=>{
  for(let c=0;c<4;c++){
   x.chs[c].forEach(rw=>{
    p16li(rw.length);
    layerInfo.push(...rw);
   });
  }
 });
 p32(layerInfo.length);
 bytes.push(...layerInfo);
 p32(0);
 const imgBytes=[];
 const p16im=v=>imgBytes.push((v>>8)&255,v&255);
 for(let c=0;c<3;c++)
  mRows[c].forEach(rw=>{p16im(rw.length);imgBytes.push(...rw);});
 p32(imgBytes.length);
 bytes.push(...imgBytes);
 return new Uint8Array(bytes);
}
